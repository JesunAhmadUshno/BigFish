app:
  - changed-files:
      - any-glob-to-any-file: ["app/**", "lib/**"]
agents:
  - changed-files:
      - any-glob-to-any-file: ["files/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["test/**"]
site:
  - changed-files:
      - any-glob-to-any-file: ["site/**"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "README.md", "CONTRIBUTING.md"]
